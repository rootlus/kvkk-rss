name: Update announcements and deploy Pages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap_pages:
        description: 'Geçmiş tarama sayfa sınırı (ilk kurulum için 9; boşsa 5)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: kvkk-pages-publish
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Collect and generate
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
          KVKK_USER_AGENT: kvkk-rss/1.0 (+https://github.com/${{ github.repository }})
          BOOTSTRAP_PAGES: ${{ inputs.bootstrap_pages }}
        shell: bash
        run: |
          args=()
          if [[ -n "$BOOTSTRAP_PAGES" ]]; then
            args+=(--bootstrap-pages "$BOOTSTRAP_PAGES")
          fi
          python scripts/generate_feed.py "${args[@]}"
      - name: Commit generated metadata and site
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/announcements.json docs/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update KVKK announcements'
            # An intervening human push makes this fail safely; never force push.
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
